<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATSMATRIX // AGENT GRAPH</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#030712;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
  #canvas{position:absolute;top:0;left:0;width:100%;height:100%}
  .hud{position:absolute;top:16px;left:16px;z-index:10;pointer-events:none}
  .hud h1{font-size:18px;font-weight:700;letter-spacing:2px;color:#38bdf8;text-shadow:0 0 12px #0ea5e9}
  .hud .sub{font-size:11px;color:#64748b;margin-top:2px;letter-spacing:1px}
  .panel{position:absolute;top:16px;right:16px;width:300px;background:rgba(15,23,42,0.92);border:1px solid #1e293b;border-radius:12px;padding:16px;z-index:20;backdrop-filter:blur(12px)}
  .panel h2{font-size:13px;color:#94a3b8;margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
  .source{border:1px solid #164e63;background:#082f49;border-radius:8px;padding:10px;margin-bottom:10px;font:10px ui-monospace,monospace;color:#67e8f9;line-height:1.55;word-break:break-word}
  .source strong{display:block;color:#e0f2fe;font-size:11px}
  .error{display:none;border:1px solid #7f1d1d;background:#450a0a;color:#fecaca;border-radius:7px;padding:8px;font-size:11px;margin-bottom:10px}
  .detail{border:1px solid #334155;background:#0f172a;border-radius:8px;padding:10px;margin-bottom:10px;min-height:72px}
  .detail strong{display:block;color:#f8fafc;font-size:13px;margin-bottom:3px}.detail span{display:block;color:#94a3b8;font-size:10px;line-height:1.5}
  .agents-list{max-height:255px;overflow-y:auto}
  .agent-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 5px;border:0;border-bottom:1px solid #1e293b;background:transparent;color:#cbd5e1;font-size:12px;text-align:left;cursor:pointer}
  .agent-item:hover,.agent-item.active{background:#0f2740;color:#fff}
  .agent-item small{display:block;color:#64748b;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e}
  .stats{position:absolute;bottom:16px;left:16px;display:flex;gap:16px;z-index:10;font-size:11px;color:#64748b}
  .stats span{color:#94a3b8}
  .stats b{color:#38bdf8;font-weight:600}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="hud">
  <h1>◈ ATSMATRIX // AGENT GRAPH</h1>
  <div class="sub">STINT-NET AGENTOS · COMMAND CENTER TOPOLOGY · REPOSITORY-SYNCED</div>
</div>

<div class="panel">
  <h2>AgentOS Command Center</h2>
  <div class="source" id="source"><strong>Loading repository graph…</strong>agentos-graph.json</div>
  <div class="error" id="error"></div>
  <div class="detail" id="detail"><strong>Select a node</strong><span>Inspect its role, parent, and capabilities.</span></div>
  <div class="agents-list" id="agentsList"></div>
</div>

<div class="stats">
  <div>Agents: <b id="statAgents">0</b></div>
  <div>Sub-agents: <b id="statSubagents">0</b></div>
  <div>Links: <b id="statLinks">0</b></div>
  <div>Packets: <b id="statPackets">0</b></div>
  <div>FPS: <b id="statFps">0</b></div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, agents = [], links = [], packets = [], frame = 0, lastTime = performance.now(), fps = 0, selectedId = null;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
canvas.addEventListener('click',event=>{
  const rect=canvas.getBoundingClientRect();
  const x=(event.clientX-rect.left)*(canvas.width/rect.width), y=(event.clientY-rect.top)*(canvas.height/rect.height);
  const hit=agents.find(agent=>Math.hypot(agent.x-x,agent.y-y)<=agent.radius*1.8);
  if(hit) selectAgent(hit.id);
});

const COLORS = ['#38bdf8','#a855f7','#f43f5e','#22c55e','#f59e0b','#06b6d4','#ec4899'];

function createAgent(definition, index, total){
  const angle = (index / Math.max(1,total)) * Math.PI * 2 - Math.PI/2;
  const depth = definition.kind === 'subagent' ? 0.68 : definition.kind === 'control' ? 0.25 : 1;
  const r = Math.min(W,H) * (0.22 + depth * 0.16);
  return {
    ...definition,
    x: W/2 + Math.cos(angle)*r,
    y: H/2 + Math.sin(angle)*r,
    vx: 0, vy: 0,
    color: definition.kind === 'control' ? '#f59e0b' : definition.kind === 'subagent' ? '#a855f7' : COLORS[index % COLORS.length],
    radius: definition.kind === 'control' ? 20 : definition.kind === 'subagent' ? 10 : 15,
    pulse: index * 0.67
  };
}

async function loadGraph(){
  try{
    const response = await fetch('./agentos-graph.json',{cache:'no-store'});
    if(!response.ok) throw new Error(`Graph snapshot HTTP ${response.status}`);
    const graph = await response.json();
    if(graph.schemaVersion !== 1 || !Array.isArray(graph.nodes) || !Array.isArray(graph.links)) throw new Error('Unsupported graph snapshot');
    agents = graph.nodes.map((node,index)=>createAgent(node,index,graph.nodes.length));
    const indexById = new Map(agents.map((agent,index)=>[agent.id,index]));
    links = graph.links.map(link=>({a:indexById.get(link.source),b:indexById.get(link.target),strength:.68})).filter(link=>Number.isInteger(link.a)&&Number.isInteger(link.b));
    document.getElementById('source').innerHTML = `<strong>${escapeHtml(graph.source.repository)}</strong>${escapeHtml(graph.source.manifest)} · rev ${escapeHtml(graph.source.revision)}<br>exported ${escapeHtml(new Date(graph.generatedAt).toLocaleString())}`;
    selectedId = agents.find(agent=>agent.id==='commander')?.id || agents[0]?.id || null;
    updateUI();
  }catch(error){
    const box=document.getElementById('error'); box.style.display='block'; box.textContent=`Source unavailable: ${error.message}`;
    document.getElementById('source').innerHTML='<strong>Graph offline</strong>No demo agents substituted.';
  }
}

function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));}

function updateUI(){
  document.getElementById('statAgents').textContent = agents.length;
  document.getElementById('statSubagents').textContent = agents.filter(agent=>agent.kind==='subagent').length;
  document.getElementById('statLinks').textContent = links.length;
  const list = document.getElementById('agentsList');
  list.replaceChildren(...agents.map(agent=>{
    const button=document.createElement('button'); button.type='button'; button.className=`agent-item${agent.id===selectedId?' active':''}`;
    const dot=document.createElement('span'); dot.className='dot'; dot.style.background=agent.color; dot.style.boxShadow=`0 0 6px ${agent.color}`;
    const label=document.createElement('span'); label.textContent=agent.name;
    const meta=document.createElement('small'); meta.textContent=`${agent.kind} · ${agent.role}`; label.appendChild(meta);
    button.append(dot,label); button.onclick=()=>selectAgent(agent.id); return button;
  }));
  if(selectedId) selectAgent(selectedId,false);
}

function selectAgent(id,refreshList=true){
  selectedId=id; const agent=agents.find(item=>item.id===id); if(!agent)return;
  const detail=document.getElementById('detail'); detail.replaceChildren();
  const title=document.createElement('strong'); title.textContent=agent.name;
  const meta=document.createElement('span'); meta.textContent=`${agent.kind.toUpperCase()} · ${agent.role} · parent ${agent.parentId||'root'}`;
  const caps=document.createElement('span'); caps.textContent=agent.capabilities.length?agent.capabilities.join(' · '):'Visibility/control role — no executable capabilities';
  detail.append(title,meta,caps); if(refreshList) updateUI();
}

loadGraph();

function spawnPacket(){
  if(links.length === 0) return;
  const l = links[Math.floor(Math.random()*links.length)];
  packets.push({
    a: l.a, b: l.b,
    t: 0,
    speed: 0.008 + Math.random()*0.012,
    color: agents[l.a].color
  });
}

function physics(){
  // soft forces toward center + repulsion
  for(let i=0;i<agents.length;i++){
    let ax=0, ay=0;
    // center pull
    ax += (W/2 - agents[i].x) * 0.0008;
    ay += (H/2 - agents[i].y) * 0.0008;
    // repulsion
    for(let j=0;j<agents.length;j++){
      if(i===j) continue;
      const dx = agents[i].x - agents[j].x;
      const dy = agents[i].y - agents[j].y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      if(d < 160){
        ax += dx / d * 0.4;
        ay += dy / d * 0.4;
      }
    }
    // spring links
    links.forEach(l=>{
      if(l.a!==i && l.b!==i) return;
      const other = l.a===i ? l.b : l.a;
      const dx = agents[other].x - agents[i].x;
      const dy = agents[other].y - agents[i].y;
      const d = Math.sqrt(dx*dx+dy*dy) || 1;
      const force = (d - 180) * 0.002 * l.strength;
      ax += dx/d * force;
      ay += dy/d * force;
    });
    agents[i].vx = (agents[i].vx + ax) * 0.92;
    agents[i].vy = (agents[i].vy + ay) * 0.92;
    agents[i].x += agents[i].vx;
    agents[i].y += agents[i].vy;
    agents[i].pulse += 0.04;
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // subtle grid
  ctx.strokeStyle = 'rgba(30,41,59,0.4)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // links
  links.forEach(l=>{
    const a = agents[l.a], b = agents[l.b];
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = l.a===agents.findIndex(a=>a.id===selectedId)||l.b===agents.findIndex(a=>a.id===selectedId)?'rgba(56,189,248,.75)':'rgba(100,116,139,0.28)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  });

  // packets
  packets = packets.filter(p => {
    p.t += p.speed;
    if(p.t >= 1) return false;
    const a = agents[p.a], b = agents[p.b];
    const x = a.x + (b.x - a.x) * p.t;
    const y = a.y + (b.y - a.y) * p.t;
    ctx.beginPath();
    ctx.arc(x, y, 3.5, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    return true;
  });
  document.getElementById('statPackets').textContent = packets.length;

  // agents
  agents.forEach(a=>{
    const pulse = 1 + Math.sin(a.pulse)*0.12;
    // glow
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.radius*2.2*pulse, 0, Math.PI*2);
    ctx.fillStyle = a.color + '18';
    ctx.fill();
    // core
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.radius*pulse, 0, Math.PI*2);
    ctx.fillStyle = a.color;
    ctx.shadowColor = a.color;
    ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
    if(a.id===selectedId){ctx.beginPath();ctx.arc(a.x,a.y,a.radius*1.65,0,Math.PI*2);ctx.strokeStyle='#e0f2fe';ctx.lineWidth=1.5;ctx.stroke();}
    // label
    ctx.font = '11px system-ui';
    ctx.fillStyle = '#cbd5e1';
    ctx.textAlign = 'center';
    ctx.fillText(a.name, a.x, a.y + a.radius + 14);
  });
}

function loop(t){
  frame++;
  if(t - lastTime > 1000){
    fps = frame;
    frame = 0;
    lastTime = t;
    document.getElementById('statFps').textContent = fps;
  }
  if(Math.random() < 0.08) spawnPacket();
  physics();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
